<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, shrink-to-fit=no"
		/>
		<title>Light Unblocker</title>

		<link rel="shortcut icon" content="favicon.webp" />
	
		<script src="/scram/scramjet.all.js"></script>
		<script src="/baremux/index.js"></script>
		
		<link rel="stylesheet" href="index.css" />
		<script src="register-sw.js" defer></script>
		<script src="search.js" defer></script>
		<script src="index.js" defer></script>
	</head>

	<body>
		<div title="Scramjet Logo" class="flex-center logo-wrapper header-center">
			<img class="logo" src="light.png" alt="Scramjet" />
			<h1>Light Unblocker</h1>
		</div>
		<div class="flex-center desc left-margin">
			<p>
				Light Unblocker is a lightweight web proxy that allows you to surf the web
				unblocked. It is designed to be fast, secure, and easy to use. You can
				use it to access blocked websites, bypass censorship, and protect your
				privacy online.
			</p>
		</div>

		<form id="sj-form" class="flex-center">
			<input
				id="sj-search-engine"
				value="https://www.google.com/search?q=%s"
				type="hidden"
			/>
			<input id="sj-address" type="text" placeholder="Surf The Unblocked Web" />
		</form>
		<div class="desc left-margin">
			<p id="sj-error"></p>
			<pre id="sj-error-code"></pre>
		</div>
	</body>
</html>
