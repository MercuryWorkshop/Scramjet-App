<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Profile - Vodious</title>

		<script>
			// Arriving from the home page's black hole dive: the CSS and galaxy.js play the matching "coming out" animation
			try {
				var dived = Number(sessionStorage.getItem("vodious-dive"));
				sessionStorage.removeItem("vodious-dive");
				if (dived && Date.now() - dived < 10000) document.documentElement.classList.add("from-dive");
			} catch (e) {}
		</script>

		<link rel="icon" href="favicon.ico" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap"
		/>

		<link rel="stylesheet" href="index.css" />
		<link rel="stylesheet" href="settings.css" />
		<link rel="stylesheet" href="profile.css" />
		<script src="home.js" defer></script>
		<script src="cloak.js" defer></script>
		<script src="design.js" defer></script>
		<script src="profile.js" defer></script>
		<script src="galaxy.js" defer></script>
			</head>

	<body>
		<canvas id="galaxy" aria-hidden="true"></canvas>

		<header class="top">
			<a class="brand" href="/" title="Vodious">Vodious</a>
			<nav class="nav" aria-label="Main">
				<a href="/" class="nav-link">
					<svg viewBox="0 0 24 24" aria-hidden="true">
						<path d="M3 11.5 12 4l9 7.5" />
						<path d="M5.5 10v9.5h13V10" />
					</svg>
					Home
				</a>
				<a href="games.html" class="nav-link">
					<svg viewBox="0 0 24 24" aria-hidden="true">
						<rect x="2.5" y="7" width="19" height="11" rx="5" />
						<path d="M7.5 10.5v4M5.5 12.5h4" />
						<circle cx="15.5" cy="11.5" r=".6" />
						<circle cx="17.8" cy="13.5" r=".6" />
					</svg>
					Games
				</a>
				<a href="settings.html" class="nav-link nav-gear" aria-label="Settings" title="Settings" aria-current="page">
					<svg viewBox="0 0 24 24" aria-hidden="true">
						<circle cx="12" cy="12" r="3" />
						<path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
					</svg>
				</a>
				<button
					type="button"
					id="theme-toggle"
					class="icon-btn"
					aria-label="Switch to light theme"
				>
					<svg viewBox="0 0 24 24" aria-hidden="true">
						<circle cx="12" cy="12" r="4" />
						<path
							d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"
						/>
					</svg>
				</button>
			</nav>
		</header>

		<main class="settings-page">
				<nav class="subtabs" aria-label="Settings sections"><a href="settings.html" class="subtab">Cloak &amp; panic</a><a href="design.html" class="subtab">Design</a><a href="profile.html" class="subtab" aria-current="page">Profile</a></nav>
				<h1 class="title">Profile</h1>
				<p class="settings-sub">Make Vodious yours.</p>

				<section class="profile-card" aria-label="Your profile">
					<div id="profile-banner" class="profile-banner"></div>
					<div class="profile-row">
						<div id="profile-avatar" class="profile-avatar" aria-hidden="true"></div>
						<p id="profile-name" class="profile-name empty">Your username</p>
					</div>
				</section>

				<section class="set-card" aria-labelledby="name-h">
					<h2 id="name-h">Username</h2>
					<label class="set-field">
						<span>Shown on the home screen and your profile (up to 20 characters)</span>
						<input id="profile-name-in" type="text" maxlength="20" placeholder="Pick a username" autocomplete="off" spellcheck="false" />
					</label>
				</section>

				<section class="set-card" aria-labelledby="av-h">
					<h2 id="av-h">Profile picture</h2>
					<p class="set-note">Choose one, or upload your own.</p>
					<div id="avatar-options" class="pick-grid" role="radiogroup" aria-label="Profile picture"></div>
					<div class="set-row">
						<button type="button" id="avatar-pick" class="set-btn">Upload a picture</button>
						<button type="button" id="avatar-clear" class="set-link" hidden>Remove picture</button>
						<input type="file" id="avatar-file" accept="image/*" hidden />
					</div>
				</section>

				<section class="set-card" aria-labelledby="bn-h">
					<h2 id="bn-h">Banner</h2>
					<p class="set-note">Choose one, or upload an image (wide pictures work best).</p>
					<div id="banner-options" class="pick-grid wide" role="radiogroup" aria-label="Banner"></div>
					<div class="set-row">
						<button type="button" id="banner-pick" class="set-btn">Upload a banner</button>
						<input type="file" id="banner-file" accept="image/*" hidden />
					</div>
					<p id="profile-status" class="set-status" role="status"></p>
					<button type="button" id="profile-reset" class="set-link">Reset profile</button>
				</section>
			</main>

			<footer class="foot">
				<span>Vodious, built on Scramjet by</span>
				<a href="https://github.com/MercuryWorkshop" title="The Mercury Workshop GitHub organization">Mercury Workshop</a>
				<a href="credits.html" title="License information">Credits</a>
			</footer>
		</body>
</html>
